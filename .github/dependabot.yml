version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "Dmitriusan"
    groups:
      npm-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/vscode"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "Dmitriusan"
    groups:
      github-actions:
        patterns:
          - "*"
