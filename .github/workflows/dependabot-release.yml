name: Dependabot Release

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: dependabot-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Bump version, publish, and release
        id: release
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Pull latest main (another release may have bumped version)
          git pull origin main

          # Bump patch version from latest state
          NEW_VERSION=$(npm version patch --no-git-tag-version)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          # Package and publish with new version
          npx @vscode/vsce package --no-dependencies
          npx @vscode/vsce publish --no-dependencies

          # Commit, tag, push
          git add package.json package-lock.json
          git commit -m "chore: release $NEW_VERSION"
          git tag "$NEW_VERSION"
          git push origin main --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.version }}
          files: '*.vsix'
          generate_release_notes: true
