name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    # Above the suite's own worst case (every unit timing out), so its results still get uploaded
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: End-to-end tests (headless VS Code stable)
        run: npm run test:e2e
        env:
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/e2e-results

      - name: Upload end-to-end results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: ${{ runner.temp }}/e2e-results

  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: code-dictator.vsix
          path: '*.vsix'
